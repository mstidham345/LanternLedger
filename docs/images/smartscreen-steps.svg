<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Windows protected your PC: click More info, then Run anyway</title>
  <rect width="1200" height="470" fill="#f6efe1" rx="18"/>
  <!-- Panel 1 -->
  <g transform="translate(40,58)">
    <text x="0" y="-20" font-size="20" font-weight="700" fill="#3a2a17">Step 1 — click “More info”</text>
    <rect width="540" height="360" fill="#0f5ea8" rx="4"/>
    <text x="34" y="62" font-size="27" fill="#fff" font-weight="600">Windows protected your PC</text>
    <text x="34" y="108" font-size="16" fill="#e8f0fa">Microsoft Defender SmartScreen prevented an</text>
    <text x="34" y="132" font-size="16" fill="#e8f0fa">unrecognized app from starting. Running this app</text>
    <text x="34" y="156" font-size="16" fill="#e8f0fa">might put your PC at risk.</text>
    <text x="34" y="196" font-size="16" fill="#fff" text-decoration="underline" font-weight="600">More info</text>
    <rect x="22" y="174" width="104" height="32" rx="16" fill="none" stroke="#f2b544" stroke-width="4"/>
    <circle cx="150" cy="190" r="17" fill="#f2b544"/><text x="150" y="197" font-size="19" font-weight="800" fill="#3a2a17" text-anchor="middle">1</text>
    <rect x="380" y="300" width="136" height="38" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="448" y="325" font-size="16" fill="#fff" text-anchor="middle">Don’t run</text>
  </g>
  <!-- Arrow -->
  <g transform="translate(600,238)">
    <path d="M-12 0 H12 M4 -10 L14 0 L4 10" stroke="#9a5b13" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Panel 2 -->
  <g transform="translate(620,58)">
    <text x="0" y="-20" font-size="20" font-weight="700" fill="#3a2a17">Step 2 — click “Run anyway”</text>
    <rect width="540" height="360" fill="#0f5ea8" rx="4"/>
    <text x="34" y="62" font-size="27" fill="#fff" font-weight="600">Windows protected your PC</text>
    <text x="34" y="108" font-size="16" fill="#e8f0fa">Microsoft Defender SmartScreen prevented an</text>
    <text x="34" y="132" font-size="16" fill="#e8f0fa">unrecognized app from starting. Running this app</text>
    <text x="34" y="156" font-size="16" fill="#e8f0fa">might put your PC at risk.</text>
    <text x="34" y="200" font-size="16" fill="#fff">App:          LanternLedger.Setup.exe</text>
    <text x="34" y="226" font-size="16" fill="#fff">Publisher:  Unknown publisher</text>
    <rect x="230" y="300" width="136" height="38" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="298" y="325" font-size="16" fill="#fff" text-anchor="middle">Run anyway</text>
    <rect x="221" y="291" width="154" height="56" rx="8" fill="none" stroke="#f2b544" stroke-width="4"/>
    <circle cx="208" cy="282" r="17" fill="#f2b544"/><text x="208" y="289" font-size="19" font-weight="800" fill="#3a2a17" text-anchor="middle">2</text>
    <rect x="380" y="300" width="136" height="38" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="448" y="325" font-size="16" fill="#fff" text-anchor="middle">Don’t run</text>
  </g>
</svg>
